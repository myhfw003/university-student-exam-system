server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端独立入口
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 入口门户页（静态 HTML，引用 /assets/app.css）
    location = /portal {
        return 301 /portal/;
    }

    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }

    # 学生端产物（文件名带内容哈希）与管理端同理：长期缓存，缺失即 404。
    # 少了 `try_files $uri =404`，已经不存在的旧文件名会落进下面的
    # SPA 回退、拿到一份 index.html —— 浏览器按 JS 执行 HTML，
    # 报 MIME 错误、整页白屏。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理端产物（文件名带内容哈希）与学生端同理：内容变了文件名就变，
    # 可以放心长期缓存。单独开一段是为了别落进上面的 SPA 回退——
    # 落进去的话，已经不存在的旧文件名会拿到一份 index.html，
    # 浏览器按 JS 去执行 HTML，直接报 MIME 错误、整页白屏。
    location /admin/assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # **入口 HTML 绝不能缓存**：它引用的是带哈希的产物文件名。
    # 换了产物而浏览器手里还留着上一版的入口页，就会去取已经不在的
    # 旧文件名（2026-11-27 发新前端产物时就撞上了：老师的浏览器里
    # 还存着 11-26 的 /admin/index.html）。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /portal/index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
