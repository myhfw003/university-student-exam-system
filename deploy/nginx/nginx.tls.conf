# 生产用 nginx 配置：全站 HTTPS，HTTP 自动跳转。
#
# 与默认的 nginx.conf 的差别只有两处：
#   1. 80 端口只做 301 跳转，不再代理任何业务；
#   2. 业务代理挂在 443（TLS）上，并强制 HSTS。
#
# 证书放在 /etc/nginx/certs，由 docker-compose.tls.yml 挂载：
#   fullchain.pem  证书链
#   privkey.pem    私钥（权限 600，不进版本库）
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
      '"duration":"$request_time","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/xml application/xml image/svg+xml;

    # WebSocket / SignalR 升级
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 运行时解析容器名：docker compose 重建 api 容器后 IP 会变，
    # 而 upstream 在启动时把 IP 解析死——nginx 会一直打旧 IP，表现为
    # /api/ 全 502。resolve 让它按 TTL 重新解析。
    resolver 127.0.0.11 valid=30s ipv6=off;
    upstream exam_api {
        zone exam_api 64k;
        server api:8080 resolve;
        keepalive 64;
    }

    upstream exam_web {
        zone exam_web 64k;
        server web:80 resolve;
        keepalive 32;
    }

    # HTTP 只做跳转：不给明文业务接口留口子。
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 证书链与 HSTS：浏览器此后只走 HTTPS。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://exam_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # 客户端地址放在**最后一项**：应用只认紧挨着的那一跳（最右一项），
            # 客户端自带的 X-Forwarded-For 排在更左边，不参与判定。
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /hubs/ {
            proxy_pass http://exam_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }

        location /health/ { proxy_pass http://exam_api; access_log off; }
        location /metrics { proxy_pass http://exam_api; access_log off; }

        # 前端静态资源交给 web 服务（SPA 路由回退由其自身的 nginx 处理）
        location / {
            proxy_pass http://exam_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # 客户端地址放在**最后一项**：应用只认紧挨着的那一跳（最右一项），
            # 客户端自带的 X-Forwarded-For 排在更左边，不参与判定。
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
