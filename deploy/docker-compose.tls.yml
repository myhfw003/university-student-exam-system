# 生产 TLS 覆盖层：启用全站 HTTPS。
#
# 用法：
#   1. 把证书放到 deploy/certs/fullchain.pem 与 deploy/certs/privkey.pem（权限 600，不进版本库）
#   2. docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# 宿主机改发布 443（默认 8088 保留给内部排障时用）。
services:
  nginx:
    volumes:
      - ./nginx/nginx.tls.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${TLS_PORT:-443}:443"
