# 可选覆盖文件：把签名私钥以文件形式挂进容器（生产推荐）。
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.secrets.yml up -d
#
# 与 .env 里的 JWT_SIGNING_PRIVATE_KEY_PEM_BASE64 二选一即可；
# 两者同时配置时，文件优先（见 JwtKeyProvider 的读取顺序）。
# 源文件缺失时 compose 直接报错，不会像普通绑定挂载那样悄悄创建一个同名目录。
services:
  api:
    volumes:
      - type: bind
        source: ./secrets/jwt-private.pem
        target: /run/secrets/jwt-private.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      Jwt__SigningPrivateKeyPemFile: /run/secrets/jwt-private.pem
