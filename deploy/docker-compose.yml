name: exam

services:
  postgres:
    # 自定义镜像只多装了 pgBackRest：WAL 归档命令在数据库侧执行，
    # 备份与归档要用同一套工具、同一份配置。
    build:
      context: .
      dockerfile: backup/postgres.Dockerfile
      args:
        # apk 源：国内部署走国内镜像（留空即官方源）。
        ALPINE_MIRROR: ${ALPINE_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    image: exam-postgres:17-pgbackrest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-exam_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?必须设置 POSTGRES_OWNER_PASSWORD}
      # WAL 归档命令要连回本库，用拥有者口令。
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
      # WAL 连续归档：RPO ≤ 5 分钟靠它。
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=db archive-push
      - -c
      - archive_timeout=300
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackrest:/var/lib/pgbackrest
      - ./backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./db/01-create-roles.sql:/docker-entrypoint-initdb.d/01-create-roles.sql:ro
    # 不发布宿主机端口：数据库只在容器网络内可达。需要直连排查时用
    # docker compose exec postgres psql -U exam_owner -d exam
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-exam_owner} -d ${POSTGRES_DB:-exam}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PgBouncer 事务池：可选 profile。
  # 启用：docker compose --profile pgbouncer up -d
  # 不启用时把 DB_HOST/DB_PORT 指向 postgres:5432（见 .env.example）。
  pgbouncer:
    image: edgedb/pgbouncer:1.24
    restart: unless-stopped
    profiles: ["pgbouncer"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-exam}
      DB_USER: ${POSTGRES_APP_USER:-exam_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?必须设置 POSTGRES_APP_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 600

  # 备份定时任务：基线全量 → 每日全量/差异 → 每周过期清理。
  # WAL 由数据库侧的 archive_command 连续推送，这里不重复推。
  backup:
    image: exam-postgres:17-pgbackrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_OWNER_USER:-exam_owner}
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
      STANZA: db
      METRICS_DIR: /backup-metrics
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbackrest:/var/lib/pgbackrest
      - ./backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./backup/entrypoint.sh:/backup/entrypoint.sh:ro
      # 备份状态指标：node_exporter 的 textfile 采集器读这个目录。
      - backup-metrics:/backup-metrics
    entrypoint: ["/bin/sh", "/backup/entrypoint.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    # Redis 不发布宿主机端口
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 对象存储用 MinIO 的社区分支 **silo**：官方 minio/minio 已从 Docker Hub
    # 下架（连同 minio/mc、minio/console），照原 tag 拉会直接失败。
    # silo 保持 S3 API、MINIO_* 环境变量与 .minio.sys 数据布局不变，是就地替换。
    # 换镜像前请确认：桶名、副账号、版本化与保留策略的语义都对得上。
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-11-12T00-00-00Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-exam}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    # MinIO 控制台与 API 不对宿主机发布，仅容器网络内可达

  # 一次性任务：应用数据库迁移（复用 worker 镜像，运行时调用 Migrate()）
  migrate:
    image: exam-worker:dev
    build:
      context: ../backend
      target: worker
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 迁移直连 PG（绕开 PgBouncer），连接数压到最小。
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-exam};Username=${POSTGRES_OWNER_USER:-exam_owner};Password=${POSTGRES_OWNER_PASSWORD};Maximum Pool Size=5;Timeout=15;Command Timeout=120"
    depends_on:
      postgres:
        condition: service_healthy

  # 一次性任务：授予应用账号最小权限（追加式表回收 UPDATE/DELETE）
  db-grants:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - ./db/02-grant-app-role.sql:/sql/grant.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U ${POSTGRES_OWNER_USER:-exam_owner} -d ${POSTGRES_DB:-exam}
        -v ON_ERROR_STOP=1
        -v app_password="${POSTGRES_APP_PASSWORD}"
        -f /sql/grant.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: exam-backend:dev
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-exam};Username=${POSTGRES_APP_USER:-exam_app};Password=${POSTGRES_APP_PASSWORD};Maximum Pool Size=${DB_MAX_POOL_SIZE:-80};Minimum Pool Size=${DB_MIN_POOL_SIZE:-10};Timeout=15;Command Timeout=30;Keepalive=30"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Jwt__Issuer: ${JWT_ISSUER:-exam}
      Jwt__Audience: ${JWT_AUDIENCE:-exam-web}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      # 私钥注入三选一，优先级：挂载文件 > Base64 单行 > 内联 PEM。
      # Base64 是推荐形式：单行、无转义字符，经 compose/K8s Secret 传递不会变形。
      Jwt__SigningPrivateKeyPemFile: ${JWT_SIGNING_PRIVATE_KEY_PEM_FILE:-}
      Jwt__SigningPrivateKeyPemBase64: ${JWT_SIGNING_PRIVATE_KEY_PEM_BASE64:-}
      Jwt__SigningPrivateKeyPem: ${JWT_SIGNING_PRIVATE_KEY_PEM:-}
      Jwt__RefreshTokenPepper: ${JWT_REFRESH_TOKEN_PEPPER:?必须设置 JWT_REFRESH_TOKEN_PEPPER}
      # 刷新令牌的 Cookie 是否带 Secure。**纯 HTTP 部署**（局域网里不给证书，
      # 直接 http://ip:端口 访问）时必须显式关掉：浏览器不保存 Secure Cookie，
      # 刷新令牌会丢，用户每 15 分钟被登出一次。走 HTTPS 时保持 true。
      Jwt__RefreshCookieSecure: ${JWT_REFRESH_COOKIE_SECURE:-true}
      # 限流阈值（docs/design/05-api.md §1.5）。请求时读配置，改完即生效，不用重启。
      # 一个考场共用出口 IP 时，登录这一档要考虑调高 IP 阈值：
      # 默认 10 次/分钟/IP 是按「每人一个出口地址」定的。
      RateLimiting__LoginPerIpPerMinute: ${RATE_LIMITING_LOGIN_PER_IP_PER_MINUTE:-10}
      RateLimiting__LoginPerAccountPerMinute: ${RATE_LIMITING_LOGIN_PER_ACCOUNT_PER_MINUTE:-5}
      RateLimiting__AnswersPerUserPerMinute: ${RATE_LIMITING_ANSWERS_PER_USER_PER_MINUTE:-120}
      RateLimiting__FocusEventsPerUserPerMinute: ${RATE_LIMITING_FOCUS_EVENTS_PER_USER_PER_MINUTE:-120}
      RateLimiting__WritesPerUserPerMinute: ${RATE_LIMITING_WRITES_PER_USER_PER_MINUTE:-60}
      RateLimiting__ReadsPerMinute: ${RATE_LIMITING_READS_PER_MINUTE:-6000}
      # 受信任的反向代理网段：只有这些网段带来的 X-Forwarded-For 才认。
      # 留空即可：应用会按**容器自身网段**兜底（compose 里 nginx 与 api 之间那段网桥），
      # 考场局域网里的机器直连 API 端口时，自带的 X-Forwarded-For 不会被采信。
      # 只有反向代理不在容器网段里时才要显式指定，多个网段用逗号隔开。
      ForwardedHeaders__KnownNetworks: ${FORWARDED_HEADERS_KNOWN_NETWORKS:-}
      # 对象存储（题目附件）。附件桶是私有的，外部只通过短期签名 URL 访问。
      ObjectStorage__Enabled: ${OBJECT_STORAGE_ENABLED:-true}
      ObjectStorage__Endpoint: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-exam}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
      ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:-exam-attachments}
      ObjectStorage__UseSsl: ${OBJECT_STORAGE_USE_SSL:-false}
    depends_on:
      db-grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # 探针以独立进程探测 /health/live，不启动第二个应用实例（否则会争抢监听端口）。
      test: ["CMD", "dotnet", "Exam.Web.dll", "--health-check", "--probe-url=http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: exam-worker:dev
    build:
      context: ../backend
      target: worker
    restart: unless-stopped
    # Worker 的指标端口（Outbox 积压、后台作业耗时、答卷对账差异）。
    # 只在容器网络内可达，不对宿主机发布端口。
    expose:
      - "9090"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-exam};Username=${POSTGRES_APP_USER:-exam_app};Password=${POSTGRES_APP_PASSWORD};Maximum Pool Size=${DB_WORKER_MAX_POOL_SIZE:-20};Minimum Pool Size=2;Timeout=15;Command Timeout=30;Keepalive=30"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Jwt__Issuer: ${JWT_ISSUER:-exam}
      Jwt__Audience: ${JWT_AUDIENCE:-exam-web}
      Jwt__RefreshTokenPepper: ${JWT_REFRESH_TOKEN_PEPPER}
    depends_on:
      db-grants:
        condition: service_completed_successfully

  # 前端静态站点（学生端与管理端两个 SPA）
  web:
    image: exam-web:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 包源：国内部署走 npmmirror（corepack 取 pnpm 版本列表也走它）。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmmirror.com/}
    restart: unless-stopped
    # 前端只由 nginx 内部反代访问，不对宿主机发布端口

  # ---------- 监控栈（可选 profile）----------
  # 启用：docker compose --profile monitoring up -d
  # 告警规则：deploy/monitoring/prometheus-rules.yml
  # 路由：deploy/monitoring/alertmanager.yml
  # 看板：deploy/monitoring/grafana/dashboard-exam.json
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - worker
    # 指标端口不对宿主机发布：只在容器网络内可达。
    expose:
      - "9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?必须设置 GRAFANA_ADMIN_PASSWORD}
      # 无外部署：看板与数据源都由 compose 里的文件提供。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard-exam.json:/var/lib/grafana/dashboards/dashboard-exam.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  # 主机层面的指标（磁盘、CPU）——磁盘告警靠它。
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # 备份任务把状态写成 textfile，这里采集：备份失败要能被告警发现。
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backup-metrics:/textfile:ro
    expose:
      - "9100"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  pgdata:
  pgbackrest:
  redisdata:
  miniodata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  backup-metrics:
