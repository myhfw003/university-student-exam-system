# pgBackRest 配置。
#
# 保留策略：全量 2 份 + 差异 7 份 + WAL 归档 4 份。
# WAL 连续归档 → RPO ≤ 5 分钟；全量每日一次 → 恢复只需重放 WAL，不必从全量开始。
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
repo1-retention-archive=4
process-max=2
start-fast=y
compress=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[global:archive-push]
process-max=2

[db]
pg1-path=/var/lib/postgresql/data
pg1-host=postgres
pg1-port=5432
pg1-database=exam
pg1-user=exam_owner

[db:archive]
archive-async=y
archive-timeout=300
