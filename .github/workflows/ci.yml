name: CI

on:
  push:
    # 仓库默认分支是 master（不是 main），少写这一条 push 就不会触发 CI。
    branches: [master, main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原依赖
        run: dotnet restore ExamManager.slnx
      - name: 构建（警告视为错误）
        run: dotnet build ExamManager.slnx -c Release --no-restore
      - name: 测试与覆盖率
        run: |
          dotnet test ExamManager.slnx -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx"
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/TestResults
      - name: OpenAPI 契约与代码一致
        # 改了控制器或契约却忘了导出，接口文档就与实现对不上。
        # 契约从运行中的应用导出，与 Swagger UI 看到的是同一份。
        run: |
          SKIP_BUILD=1 bash ../scripts/export-openapi.sh
          cd ..
          git diff --exit-code -- docs/api/openapi.json
      - name: 依赖漏洞扫描
        run: |
          dotnet list ExamManager.slnx package --vulnerable --include-transitive --format json > vulnerabilities.json
          if grep -q '"vulnerabilities": \[{' vulnerabilities.json; then
            echo "检测到高危漏洞"; cat vulnerabilities.json; exit 1
          fi
      - name: 审计动作码前后端一致
        # 前端登记的动作码必须与后端真正写出来的那些一致，
        # 否则审计页上一半动作显示成原始码，筛选项里也选不到它们。
        run: python3 ../scripts/check-audit-action-codes.py
      - name: 权限点词表前后端一致
        # 权限码是前后端共享的词表：前端写错一个码，守卫放行但接口一律 403
        # （或者反过来，入口被藏起来）——两种错都不会让测试变红。
        run: python3 ../scripts/check-permission-codes.py
      - name: 练习开放单状态码前后端一致
        # 开放单状态码是前后端共享的词表：前端把它当查询参数发给后端，
        # 写错一个码后端会判「练习状态取值不合法。」，整页筛选静默失败。
        run: python3 ../scripts/check-practice-status-codes.py
      - name: 试卷状态码前后端一致
        # 试卷状态码也是共享词表：前端按它判断「这份试卷现在能不能发、
        # 是不是已经归档」，写错一个码后端不认，而单元测试全绿。
        run: python3 ../scripts/check-paper-status-codes.py
      - name: 能力画像分档词表前后端一致
        # 能力画像的分档（掌握 / 熟悉 / 薄弱 / 样本不足）是共享词表：
        # 后端算出这个分档随 masteryLabel 发给前端，前端按它上色。
        # 两边对不上时，徽标会静默退回中性色——「薄弱」和「掌握」看起来一样。
        run: python3 ../scripts/check-ability-mastery-labels.py
      - name: 系统级设置取值词表前后端一致
        # 设置项的取值是共享词表：后端落库用它、前端显示与回传都用它。
        # 两边对不上时，前端把后端写的取值认不出来，退回缺省档——
        # 管理员明明改了设置，页面却显示成另一档，而且单元测试全绿。
        run: python3 ../scripts/check-system-setting-values.py
      - name: 系统级设置字段前后端一致
        # 设置项的字段也是共享契约：后端 DTO 加一个字段而前端没接，
        # 那一块就会一直显示成默认值（比如「有没有配原始密码」）——
        # 管理员明明配过了却看不到，而且单元测试全绿。
        run: python3 ../scripts/check-system-setting-fields.py
      - name: 错误码三处一致
        # 错误码是前后端与设计文档共用的词表：后端定义、前端取文案、
        # 文档 §11 是权威清单。三处各写一套时漂移几乎不可见——单测照过，
        # 接口照通，只有用户在界面上看到一句对不上的话。
        run: python3 ../scripts/check-error-codes.py
      - name: 名单列名词表与密码规则常量前后端一致
        # 名单列名是共享词表：后端按表头找列，前端按同一套词解析预览并提示教师。
        # 两边对不上时那一列会被**静默丢弃**——2026-11-25 就出过：界面提示填
        # 「初始密码」列，后端只认「密码」，教师给每个学生设的初始密码整列没进库。
        run: python3 ../scripts/check-roster-columns.py
      - name: 标签维度词表前后端一致
        # 标签维度是共享词表：后端决定哪些维度之间能成树（内容维度可跨维度），
        # 前端决定父标签下拉里给哪些维度。两边对不上时，用户在界面上
        # 建不出后端允许的那棵标签树——而接口是通的，看着一切正常。
        run: python3 ../scripts/check-tag-dimensions.py

  monitoring:
    name: 监控配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 指标名核对
        # 规则引用的指标必须真的被应用导出。引一个不存在的指标，
        # 规则永远不触发，等于没有这条告警——而且没有任何报错。
        run: python3 scripts/check-metric-names.py
      - name: promtool 校验告警规则
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/monitoring:/w" -w /w \
            prom/prometheus:v2.54.1 check rules prometheus-rules.yml
      - name: promtool 单元测试（人为造异常必须触发预期告警）
        # 每条规则都有正反两组用例：造出越界的指标序列，断言告警按预期 firing。
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/monitoring:/w" -w /w \
            prom/prometheus:v2.54.1 test rules prometheus-rules.test.yml
      - name: 监控栈配置渲染
        run: |
          cd deploy
          # compose 里这几个口令是必填的（:? 语法），CI 上没有 deploy/.env，
          # 不给值时 `docker compose config` 直接失败——这里给的是占位值，
          # 只做配置渲染，不起容器。
          POSTGRES_OWNER_PASSWORD=ci-only \
          POSTGRES_APP_PASSWORD=ci-only \
          REDIS_PASSWORD=ci-only \
          MINIO_ROOT_PASSWORD=ci-only \
          JWT_REFRESH_TOKEN_PEPPER=ci-only \
          GRAFANA_ADMIN_PASSWORD=ci-only \
            docker compose --profile monitoring config > /dev/null

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: 前端镜像的数据源配置
        # 镜像产物必须连真实后端。不设构建变量时前端走 mock 模式，
        # 那个产物发出去是假系统——页面不发任何后端请求，题目与成绩全是示例数据，
        # 而前端单测跑的是 mock 产物，查不出来。
        run: python3 ../scripts/check-frontend-image-data-source.py
      - name: 安装 headless 浏览器（渲染冒烟检查用）
        # 渲染冒烟检查需要真实的 Chromium。CI 里用 playwright 只做浏览器下载，
        # 检查脚本本身零依赖（直接走 CDP），本地也复用 playwright 的缓存。
        run: npx --yes playwright@1.65.0 install --with-deps chromium
      - name: 渲染冒烟检查（真实浏览器逐路由复核）
        # 样式漏移植、产物路径撞车这类问题 typecheck / lint / 单测都发现不了，
        # 只有真实浏览器渲染才暴露。缺浏览器即失败，不静默跳过。
        #
        # --serve-dist：脚本自起一个与 nginx 布局一致的静态服务器
        # （/ → 学生端，/admin/ → 管理端），直接检查生产产物本身。
        # 不用 vite preview —— 它的 SPA 回退会把 /admin/assets/*.js 也回退成
        # index.html，产物路径根本测不到。
        run: node scripts/smoke-render.mjs --serve-dist --require-browser
      - name: 端到端测试（Playwright，跑生产产物）
        # docs/design/06-frontend.md §12 的三条流程：
        #   ① 登录 → 进入练习 → 作答 → 提交 → 看解析
        #   ② 组卷 → 阅卷 → 发布成绩 → 学生看到成绩（后端就绪后打开）
        #   ③ 考试中切屏 → 被强制交卷（后端就绪后打开）
        # 跑的是 dist 产物，用与 nginx 布局一致的静态服务器托管。
        run: pnpm e2e
      - name: 依赖漏洞扫描（生产依赖，作为门禁）
        # 只有 production 依赖会进入交付产物，开发工具链（ESLint / Vitest 等）的
        # 传递依赖不进产物，单独列出仅作可见性参考。
        # audit 接口只在官方 registry 上存在，镜像源（npmmirror）未实现该接口。
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
      - name: 依赖漏洞扫描（全部依赖，仅报告不阻断）
        run: pnpm audit --audit-level=low --registry=https://registry.npmjs.org || true

  e2e:
    name: 端到端测试（真实后端）
    runs-on: ubuntu-latest
    # 真实后端：PostgreSQL 17 + Redis。应用账号 exam_app 由初始化脚本创建，
    # 密码不出现在镜像与仓库里（授权脚本统一设置）。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exam
          POSTGRES_USER: exam_owner
          POSTGRES_PASSWORD: exam_owner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam_owner -d exam"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 还原并构建后端
        working-directory: backend
        run: |
          dotnet restore ExamManager.slnx
          dotnet build ExamManager.slnx -c Release --no-restore
      - name: 建应用账号
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=exam_owner_password psql -h 127.0.0.1 -U exam_owner -d exam \
            -f deploy/db/01-create-roles.sql
      - name: 应用迁移
        working-directory: backend
        run: dotnet run --project src/Exam.Worker -c Release --no-build -- --migrate
        env:
          ConnectionStrings__Database: "Host=127.0.0.1;Port=5432;Database=exam;Username=exam_owner;Password=exam_owner_password;Maximum Pool Size=5;Timeout=15;Command Timeout=120"
      - name: 授权应用账号
        run: |
          PGPASSWORD=exam_owner_password psql -h 127.0.0.1 -U exam_owner -d exam \
            -v app_password=exam_app_password -f deploy/db/02-grant-app-role.sql
      - name: 种子数据（角色、权限与管理员）
        working-directory: backend
        run: dotnet run --project src/Exam.Worker -c Release --no-build -- --seed
        env:
          ConnectionStrings__Database: "Host=127.0.0.1;Port=5432;Database=exam;Username=exam_owner;Password=exam_owner_password;Maximum Pool Size=5;Timeout=15;Command Timeout=120"
          Seed__AdminUsername: admin
          Seed__AdminPassword: admin-e2e-password
      - name: 启动 MinIO（附件与文件导入要真对象存储）
        # 附件上传与题库导入会把文件写进对象存储。没起 MinIO 的话，
        # 那几个端点在真实后端上跑不起来（早期版本直接 500）。
        run: |
          # 拉取重试：Docker Hub 对匿名拉取有每 IP 的配额，
          # 共享出口 IP 的 runner 偶尔会撞上限流。
          for i in 1 2 3; do
            if docker pull pgsty/silo:RELEASE.2026-11-12T00-00-00Z; then break; fi
            echo "拉取失败（第 ${i} 次），重试……"
            sleep 10
          done
          docker run -d --name e2e-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=exam \
            -e MINIO_ROOT_PASSWORD=exam-e2e-password \
            pgsty/silo:RELEASE.2026-11-12T00-00-00Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO 已就绪"; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null
      - name: 安装 headless 浏览器（浏览器连后端那组用例用）
        # api 那组只打接口、不开浏览器；ui-http 那组要真的在浏览器里点页面。
        working-directory: frontend
        run: npx --yes playwright@1.65.0 install --with-deps chromium
      - name: 端到端测试（接口全景巡检与越权访问）
        # 起真实后端再打真实接口：越权与错误结构在 mock 模式下验不出来。
        # API 与测试放同一个步骤：CI 会在步骤结束时回收后台进程。
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          cd ../backend
          # 限流阈值在这一步放开：端到端验功能，不验限流。接口全景巡检会把
          # 契约里的每个接口都打一遍（几十个写请求同一个管理员账号），
          # 按 60 次/分钟/用户的阈值会误伤。限流本身由后端功能测试覆盖。
          ASPNETCORE_URLS=http://127.0.0.1:5000 \
          ConnectionStrings__Database="Host=127.0.0.1;Port=5432;Database=exam;Username=exam_app;Password=exam_app_password;Maximum Pool Size=10;Timeout=15;Command Timeout=30" \
          ConnectionStrings__Redis="127.0.0.1:6379,abortConnect=false" \
          Jwt__Issuer=exam Jwt__Audience=exam-web Jwt__RefreshTokenPepper=e2e-pepper \
          RateLimiting__LoginPerIpPerMinute=100000 RateLimiting__LoginPerAccountPerMinute=100000 \
          RateLimiting__AnswersPerUserPerMinute=100000 RateLimiting__FocusEventsPerUserPerMinute=100000 \
          RateLimiting__WritesPerUserPerMinute=100000 RateLimiting__ReadsPerMinute=1000000 \
          ObjectStorage__Enabled=true ObjectStorage__Endpoint=127.0.0.1:9000 \
          ObjectStorage__AccessKey=exam ObjectStorage__SecretKey=exam-e2e-password \
          ObjectStorage__Bucket=exam-attachments ObjectStorage__UseSsl=false \
          dotnet run --project src/Exam.Web -c Release --no-build > /tmp/api.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/health/live > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "API 未就绪"; tail -60 /tmp/api.log; exit 1; fi
          # Worker：派发 Outbox 里的领域事件。
          # **没有它，「定分驱动」的那部分功能在端到端里根本验不出来**：
          # 成绩定分只写一条领域事件，能力画像 / 错题回流 / 工作台汇总
          # 都要等 Worker 把它派发出去之后才会更新——只起 API 的话，
          # 画像永远是空的，端到端用例只能验到「空画像」。
          # 生产的拓扑里 API 与 Worker 是两个进程，这里照着来。
          ConnectionStrings__Database="Host=127.0.0.1;Port=5432;Database=exam;Username=exam_app;Password=exam_app_password;Maximum Pool Size=5;Timeout=15;Command Timeout=30" \
          ConnectionStrings__Redis="127.0.0.1:6379,abortConnect=false" \
          Jwt__Issuer=exam Jwt__Audience=exam-web Jwt__RefreshTokenPepper=e2e-pepper \
          dotnet run --project src/Exam.Worker -c Release --no-build > /tmp/worker.log 2>&1 &
          worker_ready=0
          for i in $(seq 1 60); do
            # 派发进程起来就算就绪：它每 5 秒轮询一次 Outbox。
            if grep -q "领域事件派发进程已启动" /tmp/worker.log 2>/dev/null; then worker_ready=1; break; fi
            sleep 2
          done
          if [ "$worker_ready" != "1" ]; then echo "Worker 未就绪"; tail -60 /tmp/worker.log; exit 1; fi
          cd ../frontend
          E2E_API_BASE_URL=http://127.0.0.1:5000 \
          E2E_ADMIN_USERNAME=admin E2E_ADMIN_PASSWORD=admin-e2e-password \
            pnpm exec playwright test --project=api
          # 浏览器连真实后端那组：产物要另建一份（连后端模式），再跑 ui-http。
          pnpm build:http
          E2E_API_BASE_URL=http://127.0.0.1:5000 \
          E2E_ADMIN_USERNAME=admin E2E_ADMIN_PASSWORD=admin-e2e-password \
            pnpm exec playwright test --project=ui-http
      - name: 上传失败现场（trace 与截图）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: frontend/test-results/
          retention-days: 7

  security:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描硬编码密钥
        run: bash scripts/scan-secrets.sh
